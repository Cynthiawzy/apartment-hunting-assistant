services:
  db:
    image: postgis/postgis:16-3.4
    container_name: apartment_hunting_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-apartment_hunter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-apartment_hunting}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-apartment_hunter} -d ${POSTGRES_DB:-apartment_hunting}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
